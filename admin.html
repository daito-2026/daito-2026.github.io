<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>管理 | 大東幼稚園 運動会Tシャツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Oxanium:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#111111;--muted:#8A8A8A;--line:#E6E6E6;--plate:#F2F2F0;--navy:#1F2A44;--err:#B3261E;--ok:#1B6B3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#FAFAF8}
body{background:var(--bg);color:var(--ink);font-family:"Archivo","Zen Kaku Gothic New",sans-serif;font-size:14px;letter-spacing:.02em;-webkit-font-smoothing:antialiased;line-height:1.6;
  max-width:480px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.jp{font-family:"Zen Kaku Gothic New",sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{font-weight:500;font-size:14px;text-decoration:none}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hero{padding:28px 16px 22px;border-bottom:1px solid var(--line)}
.hero h1{font-weight:400;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin:6px 0 14px}
.spec{display:grid;grid-template-columns:84px 1fr;row-gap:6px;font-size:13px}
.spec dt{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.step{padding:20px 16px;border-bottom:1px solid var(--line)}
.step h2{font-weight:400;font-size:17px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step h2 small{font-size:11px;color:var(--muted)}
.opts{display:grid;gap:8px}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
.opt{all:unset;cursor:pointer;border:1px solid var(--line);padding:12px;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-sizing:border-box}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[disabled]{opacity:.35;cursor:not-allowed}
.opt b{font-weight:500;font-size:14px}
.opt span{font-size:11px;color:var(--muted);line-height:1.5}
.sz{grid-template-columns:repeat(6,1fr)}
.sz .opt{padding:10px 0;align-items:center;min-height:40px}
.field{display:flex;border:1px solid var(--line);background:var(--bg)}
.field:focus-within{border-color:var(--ink)}
.field input{all:unset;flex:1;padding:13px 12px;font-size:16px;min-width:0}
.field input.big{font-size:20px;font-weight:500;letter-spacing:.06em}
.field input::placeholder{color:#C8C8C8}
.field .count{padding:0 12px;display:flex;align-items:center;font-size:11px;color:var(--muted)}
.fl{display:block;font-size:12px;margin:14px 0 6px}
.fl:first-child{margin-top:0}
.hint{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.7}
.hint.err,.err{color:var(--err)}
.hidden{display:none!important}
/* shirt card */
.shirt{border:1px solid var(--ink);margin-bottom:12px}
.shirt .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:500;letter-spacing:.08em}
.shirt .bd{padding:12px}
.rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chara{all:unset;cursor:pointer;flex:0 0 23%;scroll-snap-align:start;aspect-ratio:1/1;background:var(--navy);border:1px solid var(--line);position:relative;display:grid;place-items:center}
.chara img{width:80%;height:80%;object-fit:contain;display:block}
.chara em{position:absolute;left:5px;top:3px;font-style:normal;font-size:10px;color:rgba(255,255,255,.75)}
.chara[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px;box-shadow:inset 0 0 0 3px #fff}
.mini{display:block;width:100%;background:var(--navy);margin-top:10px}
.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:12px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:52px;padding:0 16px;background:var(--ink);color:#fff;font-weight:500;font-size:15px;letter-spacing:.04em;text-align:center}
.btn.line{background:#06C755}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--ink)}
.btn.danger{background:var(--bg);color:var(--err);border:1px solid var(--err)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn+.btn{margin-top:8px}
.add{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border:1px dashed var(--ink);padding:14px;text-align:center;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:14px}
.total b{font-size:26px;font-weight:500}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--ink);margin:12px 0;cursor:pointer;font-size:13px;line-height:1.6}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ink)}
.names{list-style:none;border:1px solid var(--line);margin-top:8px}
.names li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);gap:10px}
.names li:first-child{border-top:none}
.names .nm{font-family:Krungthep,Oxanium,sans-serif;font-weight:800;font-size:22px;letter-spacing:.04em;word-break:break-all}
.names .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.box{border:1px solid var(--ink);padding:16px;margin-bottom:12px}
.box.ok{border-color:var(--ok);color:var(--ok)}
.box.warn{border-color:var(--err)}
.big-id{font-size:40px;font-weight:500;letter-spacing:.02em;line-height:1.1}
.pill{display:inline-block;border:1px solid currentColor;padding:1px 8px;font-size:11px}
.copy{display:flex;border:1px solid var(--line);align-items:center;margin-top:8px}
.copy code{flex:1;padding:10px 12px;font-size:15px;font-family:inherit;word-break:break-all}
.copy button{all:unset;cursor:pointer;padding:10px 14px;border-left:1px solid var(--line);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;z-index:50;max-width:90vw}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
footer{padding:18px 16px calc(40px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.06em;gap:12px;flex-wrap:wrap}
/* v2 */
.lead{font-size:14px;line-height:1.8;margin:-4px 0 16px}
.notice{border:1px solid var(--ink);background:#F7F7F4;padding:12px 14px;font-size:13px;line-height:1.75;margin-top:16px}
.notice b{display:block;font-size:13px;margin-bottom:2px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);font-size:11px;text-align:center}
.flow span{padding:10px 0;border-left:1px solid var(--line);color:var(--muted)}
.flow span:first-child{border-left:none}
.flow b{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink);font-weight:500}
.sec{padding:24px 16px;border-bottom:1px solid var(--line)}
.sec>h2{font-weight:500;font-size:19px;margin:2px 0 4px}
.sec>.desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.q{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:500;margin:18px 0 8px}
.q:first-child{margin-top:0}
.q i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;flex:none}
.q small{font-weight:400;font-size:11px;color:var(--muted)}
.req{font-size:10px;color:var(--err);border:1px solid var(--err);padding:0 4px;margin-left:4px;font-weight:400}
.shirt .hd{background:var(--ink);color:#fff;border-bottom:none}
.shirt .hd .link{color:#fff}
.shirt .sum{font-weight:400;font-size:11px;opacity:.8;letter-spacing:.02em}
.badge{display:inline-block;background:var(--ink);color:#fff;font-size:10px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-weight:500;letter-spacing:.06em}
.opt .badge{margin-left:0;margin-right:6px}
details.chart{margin-top:10px;border:1px solid var(--line)}
details.chart summary{cursor:pointer;padding:10px 12px;font-size:12px;list-style:none;display:flex;justify-content:space-between}
details.chart summary::after{content:"＋"}
details.chart[open] summary::after{content:"－"}
details.chart table{width:100%;border-collapse:collapse;font-size:12px}
details.chart th,details.chart td{border-top:1px solid var(--line);padding:7px 4px;text-align:center}
details.chart th{font-weight:500;background:var(--plate)}
details.chart p{font-size:11px;color:var(--muted);padding:8px 12px;line-height:1.6}
.bad{border-color:var(--err)!important;box-shadow:inset 0 0 0 1px var(--err)!important}
.ferr{color:var(--err);font-size:12px;margin-top:6px}
.review{border:1px solid var(--line);margin-bottom:12px}
.review .row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.review .row:first-child{border-top:none}
.review .row img{width:44px;height:44px;object-fit:contain;background:var(--navy);display:block}
.review .nm{font-family:Krungthep,Oxanium,sans-serif;font-weight:800;font-size:20px;letter-spacing:.04em;word-break:break-all;line-height:1.2}
.review .sub{font-size:11px;color:var(--muted)}
.review .pr{font-size:13px}
.kv{display:grid;grid-template-columns:92px 1fr;row-gap:6px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--muted);font-size:12px}
.bar{position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--ink);display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .t{flex:1;line-height:1.2}
.bar .t small{display:block;font-size:11px;color:var(--muted)}
.bar .t b{font-size:20px;font-weight:500}
.bar .btn{width:auto;min-height:46px;font-size:14px;padding:0 18px}
/* guide dialog */
.guide{border:none;padding:0;margin:auto;width:min(100%,480px);max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink)}
.guide[open]{display:flex;flex-direction:column}
.guide::backdrop{background:rgba(0,0,0,.55)}
.guide .gh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--ink);font-size:17px}
.guide .gx{all:unset;cursor:pointer;font-size:20px;padding:4px 8px}
.guide .gb{flex:1;overflow-y:auto;padding:8px 16px 16px}
.guide ol{list-style:none;counter-reset:g}
.guide li{counter-increment:g;position:relative;padding:14px 0 14px 44px;border-bottom:1px solid var(--line)}
.guide li::before{content:counter(g);position:absolute;left:0;top:14px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:500}
.guide li b{display:block;font-size:17px;line-height:1.5;font-weight:500}
.guide li span{display:block;font-size:15px;line-height:1.8;color:#333;margin-top:4px}
.guide code{font-family:Krungthep,Oxanium,sans-serif;font-weight:800;font-size:18px;background:var(--plate);padding:0 6px}
.guide u{text-decoration-thickness:2px;text-underline-offset:3px}
.guide .gl{font-size:14px;line-height:1.8;color:#333;padding:10px 0 4px}
.guide .gq{font-size:14px;margin-top:14px;color:var(--muted)}
.guide .gf{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
/* shirt preview */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair figure{margin:0;background:var(--plate);position:relative}
.pair figcaption{position:absolute;left:6px;top:4px;font-size:10px;color:var(--muted)}
.shirtSvg{display:block;width:100%;height:auto}
.pv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;width:100%;min-height:44px;border:1px solid var(--ink);font-size:14px;font-weight:500;margin-top:12px}
.heroPv{all:unset;cursor:zoom-in;display:block;width:100%;margin:4px 0 16px}
.heroPv .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.viewer{border:none;padding:0;margin:auto;width:min(100%,480px);max-width:100%;height:100%;max-height:100%;background:var(--bg)}
.viewer[open]{display:flex;flex-direction:column}
.viewer::backdrop{background:rgba(0,0,0,.55)}
.viewer .vh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--ink)}
.viewer .vclose{all:unset;cursor:pointer;background:var(--ink);color:#fff;padding:8px 14px;font-size:13px}
.viewer .vb{flex:1;overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.viewer figure{margin:0 0 14px;background:var(--plate)}
.viewer figcaption{font-size:12px;padding:8px 10px 0}
.viewer .vmeta{font-size:13px;margin-bottom:10px}
.viewer .vnote{font-size:11px;color:var(--muted)}
.review .row.big{grid-template-columns:1fr;gap:8px}
.review .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
/* pickup qr */
.qrbox{border:1px solid var(--ink);padding:16px;text-align:center;background:#fff}
#qr svg{width:min(70vw,260px);height:auto;display:block;margin:0 auto}
.qrid{margin-top:8px;font-size:14px;font-weight:500}
</style>
<style>
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi div{background:var(--bg);padding:12px}
.kpi b{display:block;font-size:22px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{font-weight:500;background:var(--plate)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter button{all:unset;cursor:pointer;border:1px solid var(--line);padding:6px 10px;font-size:12px}
.filter button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.ask{border:none;padding:0;margin:auto;width:min(92vw,400px);background:var(--bg)}
.ask::backdrop{background:rgba(0,0,0,.6)}
.ask .ak{padding:20px 18px}
.ask .aid{font-size:28px;font-weight:500;margin:4px 0 2px}
.ask .aname{font-size:18px}
.ask .aamt{font-size:30px;font-weight:500;margin:10px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ask .amsg{font-size:15px;line-height:1.7;margin-bottom:14px}
.sym{border:1px solid var(--ink);padding:12px;margin-bottom:10px;text-align:center}
.symq{font-size:13px;line-height:1.6}
.symt{font-size:64px;line-height:1.1;font-weight:500;margin:6px 0 10px}
.symc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.symc button{all:unset;cursor:pointer;border:1px solid var(--ink);font-size:36px;line-height:1;padding:14px 0;text-align:center}
.symc button:active{background:var(--plate)}
.symerr{color:var(--err);font-size:13px;margin-top:8px}
.symok{font-size:11px;color:var(--muted);margin-top:8px}
.memo{margin-top:8px;padding:8px 10px;background:var(--plate);font-size:13px}
.memo p{margin:2px 0 4px;line-height:1.6;word-break:break-all}
#memoText{width:100%;border:1px solid var(--ink);padding:10px;font:inherit;font-size:15px;resize:vertical}
.addRow{border:1px solid var(--line);padding:10px;margin-bottom:8px}
.addHd{font-size:12px;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between}
.addG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.addRow select,.addRow input{width:100%;border:1px solid var(--ink);padding:9px 6px;font:inherit;font-size:15px;background:#fff;border-radius:0}
.ask{max-height:92vh;overflow-y:auto}
.ord{border:1px solid var(--line);margin-bottom:6px;background:#fff}
.ord>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;padding:10px 10px 10px 12px}
.ord>summary::-webkit-details-marker{display:none}
.ord.paid{border-left:5px solid var(--ok)}.ord.unpaid{border-left:5px solid var(--err)}.ord.part{border-left:5px solid #C77700}.ord.cxl{opacity:.45}
.sid{font-weight:500;font-size:13px}.snm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scnt{font-size:12px;color:var(--muted)}
.chip{font-size:11px;padding:3px 7px;white-space:nowrap;color:#fff}.chip.ok{background:var(--ok)}.chip.ng{background:var(--err)}.chip.warn{background:#C77700}.chip.gray{background:#999}
.tag{font-size:10px;border:1px solid var(--muted);color:var(--muted);padding:0 4px;vertical-align:2px}
.det{padding:0 12px 12px;border-top:1px solid var(--line)}
.itbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.itbl th{font-weight:500;background:var(--plate);padding:5px 4px;text-align:left}
.itbl td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.itbl td small{display:block;font-size:9px;color:#C77700}
.itbl tr.addrow{background:#FFF6E8}
.itbl .bn{font-family:Krungthep,Oxanium,sans-serif;font-weight:800;font-size:13px;word-break:break-all}
.t{font-size:11px;padding:1px 6px;color:#fff}.t.ok{background:var(--ok)}.t.ng{background:var(--err)}
.pinfo{display:grid;grid-template-columns:70px 1fr;row-gap:4px;font-size:12px;margin:6px 0}
.pinfo dt{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{all:unset;cursor:pointer;border:1px solid var(--ink);padding:8px 12px;font-size:13px}
.acts button.pri{background:#C77700;border-color:#C77700;color:#fff}
.acts button.sub{border-color:var(--line);color:var(--muted);font-size:11px;padding:8px 8px}
</style>
</head>
<body class="jp">
<header><span class="logo">大東幼稚園</span><span class="label">Admin</span></header>

<form id="login" class="step hidden" novalidate>
  <h2>管理ページ</h2>
  <div class="field"><input id="pin" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="PIN"></div>
  <p class="hint err hidden" id="lgErr"></p>
  <div style="margin-top:12px"><button class="btn">開く</button></div>
</form>

<main id="app" class="hidden">
  <section class="step"><div class="kpi" id="kpi"></div>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button type="button" class="btn ghost" id="syncBtn" style="min-height:44px;font-size:13px">Square入金を確認</button>
      <button type="button" class="btn ghost" id="csvBtn" style="min-height:44px;font-size:13px">印刷リストCSV</button>
    </div>
    <p class="hint">Squareの入金は10分おきに自動で反映されます。PayPayと現金は下のボタンで記録してください。</p></section>
  <section class="step"><h2>サイズ集計 <small>有効な申込のみ</small></h2><div id="sizeTbl"></div>
    <h2 style="margin-top:18px">キャラ集計</h2><div id="charaTbl"></div></section>
  <section class="step"><h2>申込一覧</h2>
    <div class="filter" id="filter"></div>
    <div class="field" style="margin-bottom:10px"><input id="q" placeholder="名前・管理番号で検索"></div>
    <div id="list"></div></section>
</main>
<dialog id="addDlg" class="ask">
  <div class="ak">
    <p class="label">Tシャツの追加</p>
    <div class="aname" id="addId" style="margin:4px 0 10px"></div>
    <div id="addRows"></div>
    <button type="button" class="add" id="addMore" style="margin-top:8px">＋ もう1枚</button>
    <p class="hint" id="addSum"></p>
    <button type="button" class="btn" id="addSave" style="margin-top:12px">追加する</button>
    <button type="button" class="btn ghost" id="addCancel">やめる</button>
  </div>
</dialog>

/* 背面の名前プレビュー（デザインA・ネイビー、実寸mm座標）*/
const SVGNS = "http://www.w3.org/2000/svg";
function miniBack(cls, name) {

/* ---------- Tシャツ全体のプレビュー（デザインA・ネイビー、実寸mm座標。プレビューページと同じ描き方） ---------- */
const SHIRT_BODY = "M-90 0 Q-160 18 -235 42 L-405 148 L-307 305 Q-276 268 -260 245 L-262 700 L262 700 L260 245 Q276 268 307 305 L405 148 L235 42 Q160 18 90 0 ";

  return "#" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, "0")).join(""); };
let _shirtSeq = 0;

    stroke: dk(-16), "stroke-width": 2.2, fill: "none", "clip-path": `url(#${id}c)` });

<script>
let PIN = "", data = null, flt = "all";
try { PIN = sessionStorage.getItem("daito_admin") || ""; } catch (e) {}
const SIZES = ["S", "M", "L", "XL", "2XL", "3XL"];
const isPaid = o => o.paid !== "未入金" && !(o.extraDue > 0);
const due = o => o.paid === "未入金" ? o.total : (o.extraDue || 0);

async function load() {
  $("loading").classList.remove("hidden");
  try {
    data = await api("admin_list", { pin: PIN });
    try { sessionStorage.setItem("daito_admin", PIN); } catch (e) {}
    $("login").classList.add("hidden"); $("app").classList.remove("hidden"); render();
  } catch (ex) {
    try { sessionStorage.removeItem("daito_admin"); } catch (e) {}
    $("app").classList.add("hidden"); $("login").classList.remove("hidden");
    if (PIN) { $("lgErr").textContent = ex.message; $("lgErr").classList.remove("hidden"); }
  } finally { $("loading").classList.add("hidden"); }
}

function render() {
  const act = data.orders.filter(o => o.status === "有効");
  const shirts = act.reduce((a, o) => a + o.count, 0), total = act.reduce((a, o) => a + o.total, 0);
  const paid = act.reduce((a, o) => a + o.total - due(o), 0);
  const by = k => act.filter(o => o.payJp.startsWith(k)).length;
  $("kpi").innerHTML = `<div><span class="label">申込</span><b>${act.length}件</b><span class="hint">ひまわり ${act.filter(o => o.clsJp === "ひまわり組").length}／ゆり ${act.filter(o => o.clsJp === "ゆり組").length}</span></div>
    <div><span class="label">枚数</span><b>${shirts}枚</b></div>
    <div><span class="label">合計</span><b>${yen(total)}</b></div>
    <div><span class="label">入金済み</span><b>${yen(paid)}</b><span class="hint">未入金 ${yen(total - paid)}</span></div>
    <div style="grid-column:1/-1"><span class="hint" style="margin:0">支払方法：PayPay ${by("PayPay")}件／カード等 ${by("カード")}件／現金 ${by("現金")}件　締切 ${data.open ? "受付中" : "終了"}</span></div>`;
  const rows = [["大人", SIZES], ["子ども", ["120"]]];
  const cnt = (kind, size, cls) => act.filter(o => !cls || o.clsJp === cls).reduce((a, o) => a + o.items.filter(i => (i.kind === "kids" ? "子ども" : "大人") === kind && String(i.size) === size).length, 0);
  $("sizeTbl").innerHTML = `<table><tr><th>区分</th><th>サイズ</th><th>ひまわり</th><th>ゆり</th><th>計</th></tr>${rows.flatMap(([k, ss]) => ss.map(s => `<tr><td>${k}</td><td>${s}</td><td>${cnt(k, s, "ひまわり組")}</td><td>${cnt(k, s, "ゆり組")}</td><td><b>${cnt(k, s)}</b></td></tr>`)).join("")}</table>`;
  const cc = n => act.reduce((a, o) => a + o.items.filter(i => Number(i.chara) === n).length, 0);
  $("charaTbl").innerHTML = `<table><tr>${Array.from({ length: 8 }, (_, i) => `<th>${i + 1}</th>`).join("")}</tr><tr>${Array.from({ length: 8 }, (_, i) => `<td>${cc(i + 1)}</td>`).join("")}</tr></table>`;
  const F = [["all", "すべて"], ["unpaid", "未入金あり"], ["paid", "支払済"], ["extra", "追加あり"], ["himawari", "ひまわり"], ["yuri", "ゆり"], ["cxl", "取消"]];
  $("filter").innerHTML = F.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${flt === k}">${l}</button>`).join("");
  $("filter").querySelectorAll("button").forEach(b => b.onclick = () => { flt = b.dataset.f; render(); });
  renderList();
}

function renderList() {
  const q = $("q").value.trim();
  const list = data.orders.filter(o => {
    if (flt === "cxl") { if (o.status === "有効") return false; } else if (o.status !== "有効") return false;
    if (flt === "unpaid" && isPaid(o)) return false;
    if (flt === "paid" && !isPaid(o)) return false;
    if (flt === "extra" && !o.items.some(i => i.add)) return false;
    if (flt === "himawari" && o.clsJp !== "ひまわり組") return false;
    if (flt === "yuri" && o.clsJp !== "ゆり組") return false;
    return !q || [o.id, o.child, o.kana, o.memo || "", ...o.items.map(i => i.name)].join(" ").toLowerCase().includes(q.toLowerCase());
  });
  const chip = o => o.status !== "有効" ? `<span class="chip gray">取消</span>`

    <div class="det">

      <table class="itbl"><tr><th>#</th><th>区分</th><th>キャラ</th><th>背面</th><th>支払</th></tr>
        ${o.items.map((i, n) => `<tr class="${i.add ? "addrow" : ""}"><td>${n + 1}${i.add ? "<small>追加</small>" : ""}</td><td>${i.kind === "kids" ? "子" : "大"} ${esc(i.size)}</td><td>${i.chara}</td><td class="bn">${esc(i.name)}</td><td>${itemPay(o, i)}</td></tr>`).join("")}
      </table>
      <dl class="pinfo">
        <dt>元の分</dt><dd>${esc(o.payJp)}／<b class="${o.paid === "未入金" ? "err" : ""}">${esc(o.paid)}</b>${o.paidAt ? `（${esc(o.paidAt)}）` : ""}</dd>
        ${o.items.some(i => i.add) ? `<dt>追加分</dt><dd>${o.extraDue > 0 ? `<b class="err">未入金 ${yen(o.extraDue)}</b>（${esc(o.extraPay || "現金（当日）")}）` : o.paid === "未入金" ? "元の分と一緒に支払い" : "<b>支払済</b>"}</dd>` : ""}
        <dt>合計</dt><dd>${yen(o.total)}</dd>
        ${o.note ? `<dt>入金メモ</dt><dd>${esc(o.note)}</dd>` : ""}
        ${o.pickedAt ? `<dt>受け取り</dt><dd>${esc(o.pickedAt)}</dd>` : ""}
      </dl>
      <div class="memo"><span class="label">備考</span>${o.memo ? `<p>${esc(o.memo).replace(/\n/g, "<br>")}</p>` : `<p class="hint" style="margin:0">なし</p>`}
        <button type="button" class="link" data-memo="${esc(o.id)}">${o.memo ? "備考を編集" : "備考を追加"}</button></div>
      ${o.status === "有効" ? `<div class="acts">
        ${o.paid === "未入金" ? `<button type="button" data-id="${esc(o.id)}" data-s="paypay">PayPay入金</button><button type="button" data-id="${esc(o.id)}" data-s="cash">現金受領</button>` : ""}
        ${o.extraDue > 0 ? `<button type="button" class="pri" data-id="${esc(o.id)}" data-s="extra_cash">追加分 受領</button>` : ""}
        <button type="button" data-add="${esc(o.id)}">＋ 追加</button>
        ${o.paid !== "未入金" ? `<button type="button" class="sub" data-id="${esc(o.id)}" data-s="unpaid">未入金に戻す</button>` : ""}</div>` : ""}
    </div>
  </details>`).join("") || `<p class="hint">該当なし</p>`;
  $("list").querySelectorAll("[data-add]").forEach(b => b.onclick = () => openAdd(data.orders.find(x => x.id === b.dataset.add)));
  $("list").querySelectorAll("[data-memo]").forEach(b => b.onclick = () => editMemo(data.orders.find(x => x.id === b.dataset.memo)));
  $("list").querySelectorAll("[data-s]").forEach(b => b.onclick = async () => {
    const s = b.dataset.s, id = b.dataset.id, o = data.orders.find(x => x.id === id);

    const el = document.createElement("div"); el.className = "addRow";
    const draw = () => {
      el.innerHTML = `<div class="addHd">${rows.indexOf(r) + 1}枚目${rows.length > 1 ? ` <button type="button" class="link" data-rm>削除</button>` : ""}</div>
        <div class="addG"><select data-k="kind"><option value="adult"${r.kind === "adult" ? " selected" : ""}>大人</option><option value="kids"${r.kind === "kids" ? " selected" : ""}>子ども</option></select>
        <select data-k="size"><option value="">サイズ</option>${ADD_SIZES[r.kind].map(x => `<option${r.size === x ? " selected" : ""}>${x}</option>`).join("")}</select>
        <select data-k="chara"><option value="">キャラ</option>${[1,2,3,4,5,6,7,8].map(n => `<option value="${n}"${String(r.chara) === String(n) ? " selected" : ""}>${n}番</option>`).join("")}</select></div>
        <input data-k="name" value="${esc(r.name)}" placeholder="背面の名前（半角ローマ字）" autocapitalize="characters" spellcheck="false" maxlength="12">`;
      el.querySelectorAll("[data-k]").forEach(i => i.oninput = i.onchange = () => {
        let v = i.value; if (i.dataset.k === "name") { v = v.replace(/[^A-Za-z .\-]/g, ""); i.value = v; }
        r[i.dataset.k] = v; if (i.dataset.k === "kind") { r.size = r.kind === "kids" ? "120" : ""; draw(); } sum();
      });
      el.querySelector("[data-rm]")?.addEventListener("click", () => { rows.splice(rows.indexOf(r), 1); el.remove(); box.querySelectorAll(".addRow").forEach((x, i) => x.querySelector(".addHd").firstChild.textContent = `${i + 1}枚目`); sum(); });
    };
    draw(); box.appendChild(el); sum();
  };
  const sum = () => { $("addSum").textContent = `追加 ${rows.length}枚・${yen(rows.length * 3000)}${o.paid !== "未入金" ? "（支払い済みの家庭なので、追加分は未入金として記録します）" : "（合計金額に足されます）"}`; };
  box.innerHTML = ""; row();
  $("addMore").onclick = row;
  $("addCancel").onclick = () => d.close();
  $("addSave").onclick = async () => {
    const b = $("addSave");
    const bad = rows.findIndex(r => !r.size || !r.chara || !/^[A-Za-z]/.test(r.name.trim()));
    if (bad >= 0) { toast(`${bad + 1}枚目の入力が足りません`); return; }
    if (!confirm(`${o.id} ${o.child} に ${rows.length}枚追加します。よろしいですか？\n\n` + rows.map((r, i) => `${i + 1}. ${r.kind === "kids" ? "子ども" : "大人"} ${r.size}・キャラ${r.chara}・${r.name.trim()}`).join("\n"))) return;
    b.disabled = true; b.textContent = "保存中…";
    try { await api("admin_add", { pin: PIN, id: o.id, items: rows.map(r => ({ ...r, name: r.name.trim() })) }); d.close(); toast(`${o.id} に追加しました`); await load(); }
    catch (ex) { toast(/不明な操作/.test(ex.message) ? "受付の仕組み（GAS）の更新がまだのため追加できません" : ex.message); }
    finally { b.disabled = false; b.textContent = "追加する"; }
  };
  d.showModal();
}

/* 備考の編集 */
function editMemo(o) {
  const d = $("memoDlg");
  $("memoId").textContent = `${o.id} ${o.child}（${o.clsJp}）`; $("memoText").value = o.memo || "";
  d.showModal(); setTimeout(() => $("memoText").focus(), 50);
  $("memoCancel").onclick = () => d.close();
  $("memoSave").onclick = async () => {
    const b = $("memoSave"); b.disabled = true; b.textContent = "保存中…";
    try { await api("admin_memo", { pin: PIN, id: o.id, memo: $("memoText").value.trim() }); d.close(); toast(`${o.id} の備考を保存しました`); await load(); }
    catch (ex) { toast(/不明な操作/.test(ex.message) ? "受付の仕組み（GAS）の更新がまだのため保存できません" : ex.message); }
    finally { b.disabled = false; b.textContent = "保存する"; }
  };
}

/* 記録の前の確認ポップアップ */
function askMark(o, s) {
  const T = {
    extra_cash: ["追加分の入金確認", "追加分の入金（PayPay・現金など）を確認しましたか？", "はい、追加分を受け取りました", "#1B6B3A"],
    cash:   ["現金の受け取り", "この方から現金を受け取りましたか？", "はい、現金を受け取りました", "#1B6B3A"],
    paypay: ["PayPayの入金確認", "PayPayで、この金額の入金を確認しましたか？", "はい、入金を確認しました", "#1B6B3A"],
    unpaid: ["未入金に戻す", "入金の記録を取り消して「未入金」に戻しますか？", "はい、未入金に戻します", "#B3261E"],
  }[s];
  const d = $("ask");
  $("askLabel").textContent = T[0]; $("askId").textContent = `${o.id}（${o.clsJp}）`;
  $("askName").textContent = `${o.child}（${o.kana}）`; $("askAmt").textContent = s === "extra_cash" ? `追加分 ${yen(o.extraDue)}` : `${yen(o.total)}（${o.count}枚）`;
  $("askMsg").textContent = T[1]; $("askYes").textContent = `正しい記号を押すと「${T[2].replace(/^はい、/, "")}」として記録します`;
  const SYMS = ["○", "△", "□"];
  let target;
  const deal = () => {
    target = SYMS[Math.floor(Math.random() * 3)];
    $("symT").textContent = target; $("symT").style.color = T[3];
    const order = [...SYMS].sort(() => Math.random() - 0.5);
    $("symC").innerHTML = order.map(x => `<button type="button" data-sym="${x}">${x}</button>`).join("");
  };
  deal(); $("symErr").classList.add("hidden");
  d.showModal();
  return new Promise(res => {
    const done = v => { d.close(); $("symC").onclick = $("askNo").onclick = null; res(v); };
    $("symC").onclick = e => {
      const b = e.target.closest("[data-sym]"); if (!b) return;
      if (b.dataset.sym === target) done(true);
      else { $("symErr").classList.remove("hidden"); deal(); }
    };
    $("askNo").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
  });
}

$("q").addEventListener("input", renderList);
$("pin").addEventListener("input", e => e.target.value = e.target.value.replace(/\s/g, ""));
$("login").addEventListener("submit", e => { e.preventDefault(); PIN = $("pin").value; load(); });
$("syncBtn").onclick = async e => {
  const b = e.currentTarget; b.disabled = true; b.textContent = "確認中…";
  try { const d = await api("admin_sync", { pin: PIN }); toast(`${d.changed}件を入金済みにしました`); await load(); } catch (ex) { toast(ex.message); }
  b.disabled = false; b.textContent = "Square入金を確認";
};
$("csvBtn").onclick = () => {
  const head = ["管理番号", "クラス", "子どもの名前", "ふりがな", "No", "区分", "サイズ", "左胸キャラ", "背面の名前", "支払方法", "入金状況", "備考", "受取"];
  const rows = data.orders.filter(o => o.status === "有効").flatMap(o => o.items.map((i, n) => [o.id, o.clsJp, o.child, o.kana, n + 1, i.kind === "kids" ? "子ども" : "大人", i.size, i.chara, i.name, o.payJp, o.paid, o.memo || "", o.pickedAt || ""]));
  const csv = "﻿" + [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `daito_tee_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};

if (PIN) load(); else $("login").classList.remove("hidden");
</script>
